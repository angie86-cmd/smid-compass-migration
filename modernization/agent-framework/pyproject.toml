[project]
name = "smid-compass-agent-framework"
version = "0.1.0"
description = "Microsoft Agent Framework modernization of the SMID Compass orchestration (technical migration step, pre-behavior-modernization)"
requires-python = ">=3.11,<3.15"
dependencies = [
    "agent-framework-foundry>=1.16.2",
    "agent-framework-declarative>=1.5.1",
    "azure-identity>=1.27.0",
]

[project.optional-dependencies]
# Only needed for the (not-yet-deployed) Hosted Agent adapter (src/smid_compass/host.py).
# agent-framework-foundry-hosting is currently prerelease (per Microsoft's own docs),
# hence --pre and a separate extra rather than a hard dependency of local validation.
hosting = [
    "agent-framework-foundry-hosting",
]

[tool.setuptools.packages.find]
where = ["src"]
